<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020806"/>
      <stop offset="50%" stop-color="#04140d"/>
      <stop offset="100%" stop-color="#061f14"/>
    </linearGradient>
    <pattern id="dotsP" width="34" height="34" patternUnits="userSpaceOnUse">
